name: Build and push KiraAI image

on:
  # 上游仓库发布正式版时自动构建
  repository_dispatch:
    types: [upstream-release]
  # 兜底：每天查一次上游，发现有新正式版才构建（上游 release 不会触发我们的 workflow）
  schedule:
    - cron: '17 3 * * *'   # UTC 03:17 = 北京时间 11:17
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（留空则取上游最新正式版，如 v3.1.0）'
        required: false
        default: ''
        type: string
      push:
        description: '推送到镜像仓库'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: kira-ai
  UPSTREAM_REPO: xxynet/KiraAI
  BASE_IMAGE: xxynet/kira-ai

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_build: ${{ steps.ver.outputs.should_build }}
      base_tag: ${{ steps.ver.outputs.base_tag }}
    steps:
      - name: Resolve upstream version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          upstream=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
            | jq -r '.tag_name // empty')

          case "$EVENT" in
            release)          version="$RELEASE_TAG" ;;
            repository_dispatch) version="$PAYLOAD_TAG" ;;
            *)                version="$INPUT_TAG" ;;
          esac
          [ -z "$version" ] && version="$upstream"

          # 上游基础镜像对应的 tag：v3.1.0 -> v3.1.0（上游同时打 latest，这里优先用版本号）
          base="$version"

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "base_tag=$base"         >> "$GITHUB_OUTPUT"
          echo "upstream latest: $upstream"
          echo "resolved version: $version"

          # 只在定时任务里做“已构建过就跳过”判断，省 Actions 额度
          if [ "$EVENT" = "schedule" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${IMAGE_NAME}/versions")
            if [ "$code" = "200" ] && [ -n "$version" ]; then
              exists=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${IMAGE_NAME}/versions?per_page=100" \
                | jq -r --arg t "$version" '[.[] | .metadata.container.tags[]? | select(. == $t)] | length')
              if [ "${exists:-0}" -gt 0 ]; then
                echo "should_build=false" >> "$GITHUB_OUTPUT"
                echo "$version 已存在，跳过"
                exit 0
              fi
            fi
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show build info
        run: |
          echo "event: ${{ github.event_name }}"
          echo "version: ${{ needs.resolve.outputs.version }}"
          echo "base tag: ${{ needs.resolve.outputs.base_tag }}"
          echo "sha: ${{ github.sha }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          platforms: linux/arm64,linux/amd64

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${VERSION}"
            echo "ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:sha-${short}"
            echo 'EOF'
            echo 'tags_dockerhub<<EOF'
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
              echo "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${VERSION}"
              echo "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:sha-${short}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # 只有 workflow_dispatch / schedule 这类手动或定时入口才移动 latest，
      # 避免旧的补构建把 latest 指回旧版本
      - name: Decide latest
        id: latest
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64
          push: ${{ (github.event_name != 'workflow_dispatch') || inputs.push }}
          tags: |
            ${{ steps.tags.outputs.tags }}
            ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest
          build-args: |
            BASE_TAG=${{ needs.resolve.outputs.base_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,scope=multiarch,mode=max
          provenance: false
          sbom: false

      - name: Build & push (Docker Hub, 失败不影响主流程)
        if: ${{ steps.dockerhub.outputs.enabled == 'true' && ((github.event_name != 'workflow_dispatch') || inputs.push) }}
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.tags_dockerhub }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest
          build-args: |
            BASE_TAG=${{ needs.resolve.outputs.base_tag }}
          cache-from: type=gha,scope=multiarch
          provenance: false

      - name: Summary
        run: |
          {
            echo "### 构建完成"
            echo "- 版本：\`${{ needs.resolve.outputs.version }}\`"
            echo "- 基础镜像：\`${BASE_IMAGE}:${{ needs.resolve.outputs.base_tag }}\`"
            echo "- GHCR：\`ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${{ needs.resolve.outputs.version }}\`"
            echo "- 架构：linux/arm64, linux/amd64"
          } >> "$GITHUB_STEP_SUMMARY"
