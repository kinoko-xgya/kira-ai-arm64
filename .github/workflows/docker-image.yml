name: Build and push KiraAI image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag
        required: true
        default: latest
        type: string
      push:
        description: Push image
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "IMGTAG=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "IMGTAG=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show build info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Image tag: ${{ steps.tag.outputs.IMGTAG }}"
          echo "SHA: ${{ github.sha }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          platforms: linux/arm64

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: ${{ (github.event_name == 'release') || inputs.push }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kira-ai:${{ steps.tag.outputs.IMGTAG }}
            ghcr.io/${{ github.repository_owner }}/kira-ai:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kira-ai:${{ steps.tag.outputs.IMGTAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kira-ai:sha-${{ github.sha }}
          cache-from: type=gha,scope=arm64-${{ github.event_name }}
          cache-to: type=gha,scope=arm64-${{ github.event_name }},mode=max
          provenance: false

      - name: Image info
        run: |
          echo "=== Built images ==="
          echo "ghcr.io/${{ github.repository_owner }}/kira-ai:${{ steps.tag.outputs.IMGTAG }}"
          echo "ghcr.io/${{ github.repository_owner }}/kira-ai:sha-${{ github.sha }}"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/kira-ai:${{ steps.tag.outputs.IMGTAG }}"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/kira-ai:sha-${{ github.sha }}"
